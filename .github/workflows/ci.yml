name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Testcontainers (apps/api integration tests) will use the Docker daemon that
    # ships with ubuntu-latest runners; no extra service or setup is needed here.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # pnpm version is read from "packageManager" in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      # Consumers resolve @traceflow/shared types from its dist/, so it must be
      # built before lint and typecheck.
      - name: Build shared package
        run: pnpm --filter @traceflow/shared build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # O contrato OpenAPI e os tipos do front são gerados da API: falha se alguém mudou a API
      # sem regenerar (`pnpm openapi`) e commitar.
      - name: Check OpenAPI contract is up to date
        run: pnpm openapi:check

  e2e:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: traceflow
          POSTGRES_PASSWORD: traceflow
          POSTGRES_DB: traceflow
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U traceflow" --health-interval 5s --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://traceflow:traceflow@localhost:5432/traceflow
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared, API and web
        run: |
          pnpm --filter @traceflow/shared build
          pnpm --filter @traceflow/api build
          pnpm --filter @traceflow/web build

      - name: Migrate and seed the database
        run: |
          pnpm --filter @traceflow/api db:deploy
          pnpm --filter @traceflow/api db:seed

      # API com login simulado (mesmo modo do desenvolvimento) e o build do front no `vite preview`.
      - name: Start API and web
        env:
          AUTH_MODE: mock
          CORS_ORIGINS: http://localhost:4173
          PUBLIC_WEB_URL: http://localhost:4173
          RATE_LIMIT_PER_MINUTE: '100000'
          LOG_PRETTY: 'false'
        run: |
          (cd apps/api && node dist/main.js > ../../api.log 2>&1 &)
          (cd apps/web && npx vite preview --port 4173 --strictPort > ../../web.log 2>&1 &)
          for url in http://localhost:3000/v1/health http://localhost:4173/login; do
            for i in $(seq 1 60); do curl -fs "$url" > /dev/null && break; sleep 1; done
            curl -fs "$url" > /dev/null || { echo "::error::$url did not start"; cat api.log web.log; exit 1; }
          done

      - name: Install Chromium
        run: pnpm --filter @traceflow/e2e exec playwright install --with-deps chromium

      - name: Run browser tests
        run: pnpm e2e

      - name: Upload report and logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
            api.log
            web.log
          retention-days: 7

  terraform:
    name: Terraform fmt and validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false

      # Sem backend e sem credenciais AWS: só sintaxe, tipos e ligação entre módulos.
      - name: Validate modules and environments
        working-directory: infra/terraform
        run: sh validate.sh
