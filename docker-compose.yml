name: traceflow

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-traceflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-traceflow}
      POSTGRES_DB: ${POSTGRES_DB:-traceflow}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  # API em contêiner (mesma imagem da produção). Uso: docker compose --profile full up --build
  api:
    profiles: [full]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: 3000
      LOG_LEVEL: info
      CORS_ORIGINS: http://localhost:5173
      SWAGGER_ENABLED: 'true'
      DATABASE_URL: postgresql://${POSTGRES_USER:-traceflow}:${POSTGRES_PASSWORD:-traceflow}@postgres:5432/${POSTGRES_DB:-traceflow}
      DATABASE_POOL_MAX: 5
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
